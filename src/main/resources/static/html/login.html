<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMessage - 登录</title>
    <!-- 请确保此处路径正确，静态资源目录下的 css/login.css -->
    <link rel="stylesheet" type="text/css" href="/css/login.css">
</head>

<body>
<div id="wrap">
    <div id="header">
        <p id="sysdate">时间: <span id="currentDate"></span></p>
        <h1 id="title"><a href="#">IMessage System</a></h1>
    </div>
    <div id="content">
        <h2>用户登录</h2>
        <!-- 将容器ID修改为 loginFormContainer，避免与表单 ID 重复 -->
        <div id="loginFormContainer">
            <form id="loginForm" action="/html/doLogin" method="post">
                <div class="form-group">
                    <label for="username">用户名：</label>
                    <input type="text" id="username" name="username" class="inputgri" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="password">密码：</label>
                    <input type="password" id="password" name="password" class="inputgri" placeholder="请输入密码" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="button">登录</button>
                    <a href="reg.html" class="register-link">还没有注册？</a>
                </div>
            </form>
        </div>
    </div>
    <div id="footer">
        <p>&copy; 20XX SOFT863</p>
    </div>
</div>
<script src="/js/login.js"></script>
<script>
    function updateTime() {
        let now = new Date();
        document.getElementById("currentDate").innerText = now.getFullYear() + "-" +
            ("0" + (now.getMonth() + 1)).slice(-2) + "-" +
            ("0" + now.getDate()).slice(-2);
    }
    updateTime();
</script>
</body>
</html>
